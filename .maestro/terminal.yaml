# Device smoke test, run on EAS by .eas/workflows/e2e.yml (or locally: maestro test .maestro).
# appId must match expo.ios.bundleIdentifier / expo.android.package (production variant).
#
# The web tests can't see the native WebView that hosts xterm.js, or the native TCP
# socket SSH uses. A session connects only after that WebView has loaded and measured
# the terminal, so reaching "Couldn't reach" proves the terminal renders and the socket
# module loads on the device. Tapping the keyboard key checks that the in-app keyboard's
# touch surface receives native touches. The preview, asked for a port on a session that
# isn't connected, says so (a page needs a real host with a dev server: check that by hand).
appId: com.lexingtonstanley.flareterminal
---
- launchApp:
    clearState: true
- assertVisible: 'Connect to your computer over SSH'
- tapOn: 'New connection'
- tapOn:
    id: 'connection-save'
- assertVisible: 'Enter your username on that computer'
- tapOn:
    id: 'connection-host'
- inputText: 'nobody@127.0.0.1:9'
- hideKeyboard
- tapOn:
    id: 'connection-save'
- tapOn: 'nobody@127.0.0.1:9'
- extendedWaitUntil:
    visible: "Couldn't reach 127.0.0.1:9.*"
    timeout: 30000
- assertVisible: 'Reconnect'
- assertVisible: 'Escape'
- tapOn: 'Coding keyboard'
- assertVisible: 'System keyboard'
- assertVisible: 'Backspace'
- tapOn: 'Preview a dev server'
- tapOn:
    id: 'preview-port'
- inputText: '3000'
# The button sits above the number pad, which has no key to close it on iOS.
- tapOn: 'Open preview'
- extendedWaitUntil:
    visible: 'The session isn.t connected.*'
    timeout: 10000
